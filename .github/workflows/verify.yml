name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install ruff

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python tests/test_metadata.py
